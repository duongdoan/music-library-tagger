<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#138a86"/>
      <stop offset="1" stop-color="#0a4957"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eeec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#032a30" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <radialGradient id="sheen" cx="0.3" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="hole">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="356" cy="512" r="30" fill="#000"/>
    </mask>
  </defs>
  <!-- macOS icon grid: 824 px body, 100 px margin -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <g clip-path="url(#body)">
  <g transform="rotate(-14 530 512) translate(18 0)">
    <path d="M 356 484 C 312 400 250 340 60 300" fill="none" stroke="#f5b83d" stroke-width="16" stroke-linecap="round"/>
    <g filter="url(#shadow)">
      <path mask="url(#hole)" fill="url(#tag)"
        d="M 262 512 L 380 374 Q 392 360 410 360 L 756 360 Q 790 360 790 394 L 790 630 Q 790 664 756 664 L 410 664 Q 392 664 380 650 Z"/>
    </g>
    <circle cx="356" cy="512" r="30" fill="none" stroke="#f5b83d" stroke-width="12"/>
    <!-- beamed eighth notes -->
    <g fill="#0b6868">
      <polygon points="540,430 680,404 680,440 540,466"/>
      <rect x="540" y="440" width="22" height="146" rx="6"/>
      <rect x="658" y="414" width="22" height="146" rx="6"/>
      <ellipse cx="516" cy="590" rx="44" ry="33" transform="rotate(-20 516 590)"/>
      <ellipse cx="634" cy="564" rx="44" ry="33" transform="rotate(-20 634 564)"/>
    </g>
  </g>
  </g>
</svg>
